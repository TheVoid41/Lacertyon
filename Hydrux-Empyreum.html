<!DOCTYPE html>

<html lang="en">

	<head>
	
		<meta charset="utf-8" />

 		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link rel="icon" type="image/png" href="Lacertyon%20Logo.png">

		<title>Hydrux Empyreum</title>

		<meta name="description" content="The Hydrux Empyreum is a giant superpower in the world of Lacertyon.
										                  This page contains information regarding this fictional nation." />

		<style>
			.skip-link {
 	 					position: absolute;
  						top: 0.5rem;
  						left: -9999px;
  						z-index: 1;
  						padding: 0.75rem 1rem;
						background: #fff;
  						color: #111;
					   }

			.skip-link:focus {
  							  left: 0.5rem;
							 }

			nav ul {
  					display: flex;
  					flex-wrap: wrap;
  					justify-content: center;
  					gap: 1rem;
  					width: fit-content;
  					margin: 0 auto 1.5rem;
  					padding: 0.75rem 1rem;
  					list-style: none;
  					background: #6baed6;
  					border-radius: 10px;
				   }

			nav a {
  					color: #fff;
  					text-decoration: none;
  					font-weight: 700;
				  }

			nav a:hover,
			nav a:focus-visible {
  				  text-decoration: underline;
  				  text-underline-offset: 0.15em;
				   }
			
			 :root {
 				 	--page-bg: #2171b5;
 			 		--card-bg: #6baed6;
 				 	--text: #ffffff;
				 	--accent: #a7e8d5;
 				 	--accent-hover: #d0fff0;
				   }

				* {
 				 box-sizing: border-box;
				 }
			body {
  					margin: 0;
 					padding: 2rem 1rem;
  					font-family: Arial, sans-serif;
  					line-height: 1.6;
  					color: var(--text);
  					background: var(--page-bg);
				}
			main {
  					max-width: 900px;
  					margin: 0 auto;
  					padding: 2rem;
  					background: var(--card-bg);
  					border-radius: 12px;
  					box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
				}
			p {
  			margin: 0.8rem 0;
			}

			ul {
  			padding-left: 1.5rem;
			}

			li {
  			margin: 0.5rem 0;
			}

			a {
  			color: var(--accent);
			}

			a:hover,
			a:focus-visible {
  			color: var(--accent-hover);
  			text-decoration-thickness: 2px;
			}
			h1,
			h2,
			h3 {
  			line-height: 1.2;
			}

			h1 {
  			margin-top: 0;
  			font-size: clamp(2rem, 5vw, 2.8rem);
			}

			h2 {
  			margin-top: 2rem;
  			padding-bottom: 0.4rem;
  			border-bottom: 2px solid #c7d2d6;
			}

			h3 {
  			margin-top: 1.5rem;
			}
			@media (max-width: 600px) {
 			 body {
    			padding: 1rem 0.75rem;
 			 }

  			main {
   			padding: 1.25rem;
  			}
			}
			
		</style>

  </head>
